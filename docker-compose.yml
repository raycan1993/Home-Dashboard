# Home Dashboard - full local stack.
#
# Three containers on a private Docker bridge network:
#   db      - PostgreSQL 16, not reachable from the host network
#   server  - Node/Express API, reachable only by web
#   web     - nginx serving the React SPA and proxying /api to server

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: home_dashboard_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-home_dashboard_secret}
      POSTGRES_DB: home_dashboard
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_dashboard_app -d home_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard_app:${DB_PASSWORD:-home_dashboard_secret}@db:5432/home_dashboard?sslmode=disable
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      WEATHER_PLZ: ${WEATHER_PLZ:-8400}
      WEATHER_CITY: ${WEATHER_CITY:-Winterthur}
      SBB_FROM: ${SBB_FROM:-Winterthur}
      SBB_TO: ${SBB_TO:-Zürich HB}
      SBB_NUM_CONNECTIONS: ${SBB_NUM_CONNECTIONS:-5}
      DEVELOPER_MODE: ${DEVELOPER_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
