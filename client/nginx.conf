# Static SPA + /api reverse proxy to the server container.
#
# Security headers added here as a second layer; the server also sets them
# via Helmet on its responses.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version banner
    server_tokens off;

    # Defence-in-depth headers (also set by Helmet on /api responses)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cap request body size (server also enforces 100kb)
    client_max_body_size 256k;

    # API → server container. Service name `server` resolves on the Docker network.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE log stream needs no buffering and a long read timeout
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    # SPA fallback — any non-/api path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
